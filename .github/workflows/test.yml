name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5
      - uses: bats-core/bats-action@4.0.0
        with:
          bats-version: 1.14.0
          file-install: false
          support-install: false
          assert-install: false
          detik-install: false
      - run: make test
